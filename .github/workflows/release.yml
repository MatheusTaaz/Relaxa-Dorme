name: Official Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Build, Sign & Publish Official APK
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout public repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Checkout private assets repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.ASSETS_REPO_NAME || 'MatheusTaaz/Relaxa-Dorme-Assets' }}
          token: ${{ secrets.ASSETS_REPO_TOKEN }}
          path: _private_assets
          persist-credentials: false

      - name: Overlay and validate private assets
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets
          cp -a _private_assets/app/src/main/assets/. app/src/main/assets/
          cp -a _private_assets/app/src/main/res/. app/src/main/res/
          cp -a "_private_assets/MUSIC" ./MUSIC
          cp -a _private_assets/catalog.json ./catalog.json

          rm -rf _private_assets

          GHOSTY_COUNT="$(find app/src/main/assets/ghosty -maxdepth 1 -type f -name '*.png' | wc -l | tr -d '[:space:]')"
          SOUNDS_COUNT="$(find app/src/main/assets/sounds -type f -name '*.ogg' | wc -l | tr -d '[:space:]')"
          DEMO_COUNT="$(find app/src/main/assets/demo_music -type f -name '*.ogg' | wc -l | tr -d '[:space:]')"
          COVER_COUNT="$(find app/src/main/assets/covers -maxdepth 1 -type f -name 'nordic_fantasy.jpg' | wc -l | tr -d '[:space:]')"
          LAUNCHER_COUNT="$(find app/src/main/res -path '*/mipmap-*/ic_launcher*.png' -type f | wc -l | tr -d '[:space:]')"
          SPLASH_COUNT="$(find app/src/main/res -path '*/drawable-*/ic_splash_ghosty.png' -type f | wc -l | tr -d '[:space:]')"
          ELEMENTAL_COUNT="$(find "MUSIC/ELEMENTAL DREAMS" -type f | wc -l | tr -d '[:space:]')"

          echo "Validated counts:"
          echo "  Ghosty PNGs: ${GHOSTY_COUNT} (expected: 16)"
          echo "  Ambient sounds OGGs: ${SOUNDS_COUNT} (expected: 18)"
          echo "  Demo music OGGs: ${DEMO_COUNT} (expected: 4)"
          echo "  Nordic Fantasy cover: ${COVER_COUNT} (expected: 1)"
          echo "  Launcher PNGs: ${LAUNCHER_COUNT} (expected: 15)"
          echo "  Splash PNGs: ${SPLASH_COUNT} (expected: 5)"
          echo "  Elemental Dreams files: ${ELEMENTAL_COUNT} (expected: 60)"

          test "${GHOSTY_COUNT}" -eq 16
          test "${SOUNDS_COUNT}" -eq 18
          test "${DEMO_COUNT}" -eq 4
          test "${COVER_COUNT}" -eq 1
          test "${LAUNCHER_COUNT}" -eq 15
          test "${SPLASH_COUNT}" -eq 5
          test "${ELEMENTAL_COUNT}" -eq 60
          test -s catalog.json

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Decode signing keystore to runner temp
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing or empty."
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/release-signing.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 -d > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          test -s "${KEYSTORE_PATH}"
          echo "ANDROID_KEYSTORE_FILE=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build signed Release APK
        env:
          R2_BASE_PUBLIC_URL: ${{ vars.R2_BASE_PUBLIC_URL || secrets.R2_BASE_PUBLIC_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_FILE:-}" ] || [ ! -s "${ANDROID_KEYSTORE_FILE}" ]; then
            echo "::error::ANDROID_KEYSTORE_FILE is not set or file does not exist."
            exit 1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "::error::One or more Android signing secrets (ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) are empty."
            exit 1
          fi
          if [ -z "${R2_BASE_PUBLIC_URL}" ]; then
            echo "::error::R2_BASE_PUBLIC_URL is empty. Configure it in GitHub Actions Variables or Secrets before building an official Release."
            exit 1
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature and generate SHA-256
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          test -s "${APK_SOURCE}"

          if unzip -l "${APK_SOURCE}" | grep -E -i '\.(jks|keystore|pfx|p12|pem|key)$'; then
            echo "::error::Signing key material detected inside APK!"
            exit 1
          fi

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK_SOURCE}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            RELEASE_APK="Relaxa-e-Dorme-test-${GITHUB_RUN_NUMBER}.apk"
          else
            RELEASE_APK="Relaxa-e-Dorme-${GITHUB_REF_NAME}.apk"
          fi
          RELEASE_SHA="${RELEASE_APK}.sha256"

          cp "${APK_SOURCE}" "${RELEASE_APK}"
          sha256sum "${RELEASE_APK}" > "${RELEASE_SHA}"
          cat "${RELEASE_SHA}"

          {
            echo "RELEASE_APK=${RELEASE_APK}"
            echo "RELEASE_SHA=${RELEASE_SHA}"
          } >> "${GITHUB_ENV}"

      - name: Upload temporary APK and checksum artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-apk-test-${{ github.run_number }}
          path: |
            ${{ env.RELEASE_APK }}
            ${{ env.RELEASE_SHA }}
          retention-days: 7
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${RELEASE_APK}" "${RELEASE_SHA}" --clobber
          else
            gh release create "${TAG_NAME}" "${RELEASE_APK}" "${RELEASE_SHA}" \
              --title "${TAG_NAME}" \
              --generate-notes \
              --verify-tag
          fi

      - name: Cleanup temporary keystore and private assets
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/release-signing.jks"
          rm -f "${RELEASE_APK:-}" "${RELEASE_SHA:-}"
          rm -rf _private_assets
